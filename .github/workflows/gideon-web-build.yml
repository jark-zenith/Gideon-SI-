name: GIDEON SI web build

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/gideon-web-build.yml"
  push:
    branches: [main, feat/clean-ui-migration]
    paths:
      - "apps/web/**"
      - ".github/workflows/gideon-web-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
